# =====================
# 导航菜单
# =====================

menu:
  首页: / || fas fa-home
  博客 || fas fa-blog:
    归档: /archives/ || fas fa-archive
    分类: /categories/ || fas fa-folder-open
    标签: /tags/ || fas fa-tags
  友链: /link/ || fas fa-link
  留言板: /messageboard/ || fas fa-paper-plane
  关于: /about/ || fas fa-heart

# =====================
# 站内搜索
# =====================
search:
  use: local_search
  placeholder: 搜索一下叭～（虽然还什么都没有><)
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false




# =====================
# 社交链接
# =====================
social:
  fas fa-envelope: mailto:natsu_ame.com || Email || '#4a7dbe'
  fab fa-github: https://github.com/natsu_faye || GitHub || '#24292e'
  fab fa-qq: https://wpa.qq.com/msgrd?u=3763786307 || QQ || '#87CEEB'
  fas fa-rss: /atom.xml || RSS订阅 || '#f26522'

# =====================
# 主题颜色
# =====================
theme_color:
  enable: true
  main: "#5bc0de"
  paginator: "#3da8c4"
  button_hover: "#3da8c4"
  text_selection: "#5bc0de"
  link_color: "#4a9ec4"
  meta_color: "#858585"
  hr_color: "#a8dce8"
  code_foreground: "#2c5f70"
  code_background: "rgba(91, 192, 222, .05)"
  toc_color: "#3da8c4"
  blockquote_padding_color: "#5bc0de"
  blockquote_background_color: "#f0f9fc"
  scrollbar_color: "#5bc0de"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"


# =====================
# 图片
# =====================
favicon: /images/favicon.png

avatar:
  img: /images/avatar.jpg
  effect: true

default_top_img: /images/banner2.jpg
index_img: /images/banner.jpg

# =====================
# subtitle
# =====================
subtitle:
  enable: true
  effect: true
  typed_option:
    source: false
  sub:
    - "record my growth"
    - "回忆是很煎熬的事呢ᵟຶᴖ ᵟຶ"
    - "トゥットゥルー〜☆"


inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom: []